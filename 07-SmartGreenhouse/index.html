<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Greenhouse</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-light">

  <!-- Barra de navegação -->
  <nav class="navbar navbar-dark bg-dark">
    <div class="container">
      <span class="navbar-brand"><i class="fa-solid fa-seedling me-2"></i>Smart Greenhouse</span>
      <span class="navbar-text text-white">Dashboard</span>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Sensores -->
    <div class="row g-3 mb-3">
      <div class="col-md-4">
        <div class="card"><div class="card-body">
          <div class="text-muted small"><i class="fa-solid fa-temperature-half me-1"></i>Temperature</div>
          <div class="fs-3 fw-semibold text-success"><span id="temperature-value">--</span> °C</div>
          <div class="text-muted small" id="temperature-time">Waiting for data…</div>
        </div></div>
      </div>
      <div class="col-md-4">
        <div class="card"><div class="card-body">
          <div class="text-muted small"><i class="fa-solid fa-droplet me-1"></i>Humidity</div>
          <div class="fs-3 fw-semibold text-success"><span id="humidity-value">--</span> %</div>
          <div class="text-muted small" id="humidity-time">Waiting for data…</div>
        </div></div>
      </div>
      <div class="col-md-4">
        <div class="card"><div class="card-body">
          <div class="text-muted small"><i class="fa-solid fa-sun me-1"></i>Luminosity</div>
          <div class="fs-3 fw-semibold"><span id="luminosity-value">--</span> lux</div>
          <div class="text-muted small" id="luminosity-time">Waiting for data…</div>
        </div></div>
      </div>
    </div>

    <!-- Atuadores -->
    <div class="row">
      <div class="col-md-6 col-lg-5">
        <div class="card">
          <div class="card-header text-center fw-semibold">Actuators</div>
          <ul class="list-group list-group-flush">
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <i class="fa-solid fa-fan me-1"></i><strong>Fan</strong>
                <span id="fan-badge" class="badge bg-secondary ms-1">OFF</span>
                <div class="text-muted small" id="fan-time">Waiting for data…</div>
              </div>
              <button id="fan-button" class="btn btn-outline-secondary btn-sm" disabled>Turn on</button>
            </li>
            <li class="list-group-item d-flex justify-content-between align-items-center">
              <div>
                <i class="fa-solid fa-faucet-drip me-1"></i><strong>Irrigation</strong>
                <span id="irrigation-badge" class="badge bg-secondary ms-1">OFF</span>
                <div class="text-muted small" id="irrigation-time">Waiting for data…</div>
              </div>
              <button id="irrigation-button" class="btn btn-outline-secondary btn-sm" disabled>Turn on</button>
            </li>
          </ul>
        </div>
      </div>
    </div>

  </main>

  <script type="module" src="js/firebase.js"></script>
  <script type="module" src="js/index.js"></script>
</body>
</html>
